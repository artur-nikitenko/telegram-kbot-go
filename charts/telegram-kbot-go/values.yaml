autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
service:
  type: ClusterIP
  port: 8080
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
image:
  registry: ghcr.io
  repository: artur-nikitenko/telegram-kbot-go
  tag: v1.1.2-3b61af2
  os: linux
  arch: amd64
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
imagePullSecrets:
  - name: ghcr-secret

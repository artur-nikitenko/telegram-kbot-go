name: KBOT-CICD

on:
  push:
    branches: [ develop ]

permissions:
  contents: write

env:
  TARGETARCH: amd64
  TARGETOS: linux
  CGO_ENABLED: 0

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.1'
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Run linter
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m --out-format=colored-line-number

      - name: Build (dry run)
        run: make linux
  cd:
    name: CD
    needs: ci
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    env:
      TARGETARCH: amd64
      TARGETOS: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set version
        run: |
          BASE_VERSION=$(git describe --tags --abbrev=0)-$(git rev-parse --short HEAD)
          PLATFORM_SUFFIX=${{ env.TARGETOS }}-${{ env.TARGETARCH }}
          VERSION=${BASE_VERSION}-${PLATFORM_SUFFIX}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BASE_VERSION=$BASE_VERSION" >> $GITHUB_ENV
          echo "PLATFORM_SUFFIX=$PLATFORM_SUFFIX" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Docker image
        run: |
          make image push \
            TARGETARCH=${{ env.TARGETARCH }} \
            TARGETOS=${{ env.TARGETOS }}

      - name: Update Helm chart values
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq -i '
              .image.tag = strenv(VERSION) |
              .image.arch = strenv(TARGETARCH) |
              .image.os = strenv(TARGETOS)
            ' chart/values.yaml

      - name: Commit Helm chart update
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add chart/values.yaml
          git commit -m "chore: update version to $VERSION"
          git push

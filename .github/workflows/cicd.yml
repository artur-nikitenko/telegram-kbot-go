name: CI/CD Pipeline

on:
  push:
    branches:
      - feature/add-gitleaks-hook

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.1'
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Run linter
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m --out-format=colored-line-number

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24
      - name: Run tests
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build binary
        run: make linux TARGETARCH=amd64

  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: |
      i   BASE_VERSION=$(git describe --tags --abbrev=0)-$(git rev-parse --short HEAD)
          PLATFORM_SUFFIX=${{ env.TARGETOS }}-${{ env.TARGETARCH }}
          FULL_VERSION=${BASE_VERSION}-${PLATFORM_SUFFIX}
          echo "BASE_VERSION=$BASE_VERSION" >> $GITHUB_ENV
          echo "PLATFORM_SUFFIX=$PLATFORM_SUFFIX" >> $GITHUB_ENV
          echo "VERSION=$FULL_VERSION" >> $GITHUB_ENV
      - name: Build Docker image
        run: make image TARGETOS=linux TARGETARCH=amd64

  push:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push Docker image
        run: make push TARGETOS=linux TARGETARCH=amd64
